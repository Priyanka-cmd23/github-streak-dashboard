name: Daily Streak Commit

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: Priyanka-cmd23
  GIT_AUTHOR_EMAIL: radhikasaxen22@gmail.com
  GIT_COMMITTER_NAME: Priyanka-cmd23
  GIT_COMMITTER_EMAIL: radhikasaxen22@gmail.com

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Append daily entry
        run: |
          today="$(TZ=Etc/UTC date '+%Y-%m-%d')"
          stamp="$(TZ=Etc/UTC date '+%Y-%m-%d %H:%M')"
          if ! grep -qF "$today" streak-log.md; then
            echo "- $stamp : automated daily contribution" >> streak-log.md
          fi

      - name: Commit and push
        run: |
          git config user.name  "${{ env.GIT_AUTHOR_NAME }}"
          git config user.email "${{ env.GIT_AUTHOR_EMAIL }}"
          git add streak-log.md
          git diff --cached --quiet && echo "nothing to commit" || {
            git commit -m "chore: automated daily contribution $stamp"
            git push
          }
